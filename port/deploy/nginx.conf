# Inside the server { } block for your site.
# Serves Pseudo-Steve at https://your.host/pseudo-steve/
# The trailing slashes matter: they strip the /pseudo-steve prefix.

location = /pseudo-steve { return 301 /pseudo-steve/; }

location /pseudo-steve/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# To serve it at the root of a host instead:
#   location / { proxy_pass http://127.0.0.1:8080; }
