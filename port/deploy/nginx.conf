# Inside the server { } block for your site.

# --- Visual version (recommended): static files, no Go server needed ---
# Build first:  port/build-site.sh   (writes site/ps.wasm and site/wasm_exec.js)
# Then copy port/site/ to /var/www/pseudo-steve/
location = /pseudo-steve { return 301 /pseudo-steve/; }
location /pseudo-steve/ {
    alias /var/www/pseudo-steve/;
    types { application/wasm wasm; text/html html; application/javascript js; }
    gzip on;
    gzip_types application/wasm application/javascript;
}

